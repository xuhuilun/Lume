name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lume_test
          POSTGRES_PASSWORD: isolated_ci_test
          POSTGRES_DB: lume_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lume_test"
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      LUME_TEST_DATABASE_URL: postgresql+psycopg://lume_test:isolated_ci_test@127.0.0.1:5432/lume_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run ruff check backend scripts
      - run: uv run ruff format --check backend scripts
      - run: uv run python scripts/evaluation_dataset.py check --dataset evaluation/dataset-v1
      - run: uv run pytest -q --junitxml=backend-test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend-test-results.xml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx prettier --check src tests playwright.config.ts
